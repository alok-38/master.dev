<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big O</title>
  </head>
  <body>
    <script>
      function sum_char_codes(some_string) {
        let sum = 0;
        for (let i = 0; i < some_string.length; i++) {
          sum += some_string.charCodeAt(i);
        }
        return sum;
      }
    </script>
  </body>
</html>
