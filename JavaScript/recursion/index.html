<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recursion</title>
  </head>
  <body>
    <script>
      function printNumber(number) {
        if (number > 10) return;
        console.log(number);
        printNumber(number + 1);
      }
      printNumber(1);
    </script>
  </body>
</html>
