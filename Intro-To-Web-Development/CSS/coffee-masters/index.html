<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Masters</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <header class="header">
      <img
        src="https://btholt.github.io/complete-intro-to-web-dev-v3/images/coffee_masters_logo.png"
        alt="coffee masters logo"
        class="header__logo"
      />
      <h1 class="header__title">Coffee Masters</h1>
    </header>

    <main class="main">
      <!-- Items Section -->
      <section class="order" id="order">
        <h2 class="order__title">Items</h2>

        <ul class="order__list">
          <li class="order__item">
            <div class="order__item-info">
              <span class="order__qty">1x</span>
              <div class="order__details">
                <span class="order__name">Cappuccino</span>
                <span class="order__desc">Light Foam</span>
              </div>
            </div>
            <div class="order__price-wrapper">
              <span class="order__price">$4.50</span>
            </div>
          </li>

          <li class="order__item">
            <div class="order__item-info">
              <span class="order__qty">1x</span>
              <div class="order__details">
                <span class="order__name">Espresso</span>
                <span class="order__desc">Single Shot</span>
              </div>
            </div>
            <div class="order__price-wrapper">
              <span class="order__price">$3.00</span>
            </div>
          </li>

          <li class="order__item">
            <div class="order__item-info">
              <span class="order__qty">1x</span>
              <div class="order__details">
                <span class="order__name">Croissant</span>
                <span class="order__desc">Butter</span>
              </div>
            </div>
            <div class="order__price-wrapper">
              <span class="order__price">$2.75</span>
            </div>
          </li>
        </ul>
      </section>

      <!-- Payment Section -->
      <section class="payment" id="payment">
        <form class="payment__form" id="payment-form">
          <fieldset class="payment__fieldset">
            <legend class="payment__legend">Cardholder Information</legend>

            <label for="card-name" class="payment__label"
              >Name on the Card</label
            >
            <input
              type="text"
              id="card-name"
              name="cardName"
              class="payment__input payment__input--name"
              autocomplete="cc-name"
              required
            />
          </fieldset>

          <fieldset class="payment__fieldset">
            <legend class="payment__legend">Payment Details</legend>

            <label for="card-number" class="payment__label">Card Number</label>
            <input
              type="text"
              id="card-number"
              name="cardNumber"
              class="payment__input payment__input--card-number"
              inputmode="numeric"
              autocomplete="cc-number"
              placeholder="1234 5678 9012 3456"
              required
            />

            <label for="expiry" class="payment__label">Expiry Date</label>
            <input
              type="text"
              id="expiry"
              name="expiry"
              class="payment__input payment__input--expiry"
              inputmode="numeric"
              autocomplete="cc-exp"
              placeholder="MM/YY"
              required
            />
          </fieldset>
        </form>
      </section>
    </main>
    <table></table>
    <button type="submit">Place order</button>
  </body>
</html>
