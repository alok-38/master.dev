<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple IOS Calculator</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="time.js" defer></script>
    <script src="calculator.js" defer></script>
  </head>
  <body>
    <main class="device">
      <header>
        <div class="time" id="time">12.00</div>
        <div class="indicators">
          <img src="Icons.png" alt="Signal strength and battery indicators" />
        </div>
      </header>
      <div class="display" id="display"></div>
      <div class="buttons">
        <!-- Row 1 -->
        <div class="row">
          <button class="btn function" data-value="clear">AC</button>
          <button class="btn function" data-value="negate">+/-</button>
          <button class="btn function" data-value="%">%</button>
          <button class="btn operator" data-value="/">÷</button>
        </div>

        <!-- Row 2 -->
        <div class="row">
          <button class="btn number" data-value="7">7</button>
          <button class="btn number" data-value="8">8</button>
          <button class="btn number" data-value="9">9</button>
          <button class="btn operator" data-value="*">x</button>
        </div>

        <!-- Row 3 -->
        <div class="row">
          <button class="btn number" data-value="4">4</button>
          <button class="btn number" data-value="5">5</button>
          <button class="btn number" data-value="6">6</button>
          <button class="btn operator" data-value="-">-</button>
        </div>

        <!-- Row 4 -->
        <div class="row">
          <button class="btn number" data-value="1">1</button>
          <button class="btn number" data-value="2">2</button>
          <button class="btn number" data-value="3">3</button>
          <button class="btn operator" data-value="+">+</button>
        </div>

        <!-- Row 5 -->
        <div class="row">
          <button class="btn number zero" data-value="0">0</button>
          <button class="btn number dot" data-value=".">.</button>
          <button class="btn operator equals" data-value="equals">=</button>
        </div>
      </div>
    </main>
  </body>
</html>
