<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple IOS Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="device">
      <header>
        <div class="time"></div>
        <div class="indicators">
          <img src="Icons.png" alt="Signal strength and battery indicators" />
        </div>
      </header>
      <div class="display"></div>
      <div class="buttons">
        <!-- Row 1 -->
        <button class="btn function">AC</button>
        <button class="btn function">+/-</button>
        <button class="btn function">%</button>
        <button class="btn operator">÷</button>

        <!-- Row 2 -->
        <button class="btn number">7</button>
        <button class="btn number">8</button>
        <button class="btn number">9</button>
        <button class="btn operator">×</button>

        <!-- Row 3 -->
        <button class="btn number">4</button>
        <button class="btn number">5</button>
        <button class="btn number">6</button>
        <button class="btn operator">−</button>

        <!-- Row 4 -->
        <button class="btn number">1</button>
        <button class="btn number">2</button>
        <button class="btn number">3</button>
        <button class="btn operator">+</button>

        <!-- Row 5 -->
        <button class="btn number zero">0</button>
        <button class="btn number">.</button>
        <button class="btn operator equals">=</button>
      </div>
    </main>
  </body>
</html>
