<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Challenge</title>
  </head>
  <body>
    <script>
      let x = Math.floor(Math.random() * 100 + 1);
      let y = Math.floor(Math.random() * 50 + 1);
      let sum, difference, product, remainder, quotient;
      sum = x + y;
      difference = x - y;
      product = x * y;
      remainder = x % y;
      quotient = Math.floor(x / y);
      console.log(sum, difference, product, remainder, quotient);
    </script>
  </body>
</html>
