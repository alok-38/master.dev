<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Functions</title>
  </head>
  <body>
    <script>
      function greet() {
        console.log("Hi!");
      }
      for (let index = 0; index < 2; index++) {
        greet();
      }
      function sum(a, b) {
        return a + b;
      }
      console.log(sum(3, -5));
      let x = 15;
      let y = 20;
      console.log(sum(x, y));
      function greeting(name) {
        return `Hello ${name}`;
      }
      console.log(greeting(`Alok`));
    </script>
  </body>
</html>
