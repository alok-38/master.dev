<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Object</title>
  </head>
  <body>
    <script>
      let date = new Date();
      //   Day of the week
      let day = date.getDay();
      console.log(day);
      //   Hour of the day
      let hour = date.getHours();
      console.log(hour);
      //   Convert to twelve hour format
      let twleveHourFormat = hour % 12;
      console.log(twleveHourFormat);
      //   AM or PM
      let AM_or_PM = hour >= 12 ? "PM" : "AM";
      console.log(`${twleveHourFormat} ${AM_or_PM}`);
      //   With minutes
      let minutes = date.getMinutes().toString();
      console.log(minutes);
      let hourAndMinutes = `${twleveHourFormat}:${minutes} ${AM_or_PM}`;
      console.log(hourAndMinutes);
    </script>
  </body>
</html>
