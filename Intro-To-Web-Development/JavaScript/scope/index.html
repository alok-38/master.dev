<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scope</title>
  </head>
  <body>
    <script>
      const A = "A";
      let F;
      function doStuff(B) {
        console.log("B");
        const C = "C";
        let H = "H";
        if (1 + 1 === 2) {
          const D = "D";
          H = "something else";
        }
        console.log(D);
        console.log(H);
        F = "F";
      }
      doStuff();
      let E = 0;
      while (E < 3) {
        E++;
        console.log(A);
        const G = "G";
      }
      console.log(E);
      console.log(G);
    </script>
  </body>
</html>
