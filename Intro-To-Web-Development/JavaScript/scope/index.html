<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scope</title>
  </head>
  <body>
    <script>
      function addFive(number) {
        const someVariable = "You can't see me outside this function";
        return number + 5;
      }
      addFive(10);
      console.log(someVariable);
    </script>
  </body>
</html>
