<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popup Modal</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body class="app-body">
    <!-- Open Button -->
    <button id="open-modal-btn" class="btn btn-open">Open Modal</button>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <!-- Modal Container -->
      <main id="modal" class="modal-container">
        <!-- Modal Header -->
        <header class="modal-header">
          <h3 class="modal-title">This is a modal</h3>
        </header>

        <!-- Modal Body -->
        <section class="modal-body">
          <p class="modal-text">Welcome to the modal content.</p>
        </section>

        <!-- Modal Footer -->
        <footer class="modal-footer">
          <button id="close-modal-btn" class="btn btn-close">
            Close Modal
          </button>
        </footer>
      </main>
    </div>
  </body>
</html>
