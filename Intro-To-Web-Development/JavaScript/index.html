<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experimenting with JavaScript</title>
  </head>
  <body>
    <script>
      const monthlyRent = 500;
      const yearlyRent = monthlyRent * 12;
      document.write(yearlyRent);
      document.write("<br>");
      const myName = "Alok";
      document.write(myName);
      document.write("<br>");
      let timesToRepeat = 10;
      const character = "b";
      // Some loop that takes that char and repeates it that many times
      while (timesToRepeat != 0) {
        document.write(character);
        --timesToRepeat;
      }
    </script>
  </body>
</html>
