<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Object</title>
</head>
<body>
    <script>
        let x;
        x = Math.sqrt(9);
        console.log(x);
        x = Math.abs(-5);
        console.log(x);
        x = Math.round(4.2);
        console.log(x);
        x = Math.ceil(4.2);
        console.log(x);
        x = Math.floor(4.9);
        console.log(x);
        x = Math.random();
        console.log(x);
        let y = Math.random() * 10 + 1;
        console.log(y);
        let z = Math.floor(Math.random() * 10 + 1);
        console.log(z);
    </script>
</body>
</html>
