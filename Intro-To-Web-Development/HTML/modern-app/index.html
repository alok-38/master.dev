<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What a Modern App Looks Like</title>
    <script src="app.js" defer></script>
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>MyApp</h2>
      <nav>
        <a href="#">Dashboard</a>
        <a href="#">Projects</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <!-- Main Area -->
    <main>
      <!-- Header -->
      <header class="topbar">
        <input type="text" placeholder="Search..." />
        <button>Profile</button>
      </header>

      <!-- Content Section -->
      <section class="content">
        <h1>Dashboard</h1>

        <!-- Cards -->
        <div class="card">Revenue: $5,000</div>
        <div class="card">Users: 1,200</div>

        <!-- Table -->
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Project A</td>
              <td>Active</td>
            </tr>
          </tbody>
        </table>

        <!-- Form -->
        <form>
          <label>Name</label>
          <input type="text" />
          <button type="submit">Save</button>
        </form>
      </section>
    </main>
  </body>
</html>
