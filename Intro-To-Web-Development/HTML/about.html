<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Alokananda Y — Personal Blog</title>

    <meta
      name="description"
      content="The personal blog of Alokananda Y, featuring personal thoughts, writing, and updates."
    />

    <!-- Replace with the real canonical URL before deployment. -->
    <link rel="canonical" href="https://your-domain.example/" />

    <meta name="robots" content="index, follow" />
    <meta name="author" content="Alokananda Y" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alokananda Y — Personal Blog" />
    <meta
      property="og:description"
      content="The personal blog of Alokananda Y, featuring personal thoughts, writing, and updates."
    />
    <meta property="og:url" content="https://your-domain.example/" />
    <meta property="og:site_name" content="Alokananda Y — Personal Blog" />

    <!--
      Add an og:image only when you have a real social-sharing image.
      Example:
      <meta property="og:image" content="https://your-domain.example/images/og-image.jpg">
    -->

    <!-- Twitter/X uses Open Graph metadata in many clients.
         Add platform-specific metadata only if you have a suitable image. -->
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#ffffff" />

    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Hi! About me!!</h1>
    </header>

    <main id="main-content">
      <!-- Blog content can be added here. -->
    </main>

    <footer>
      <p>
        &copy; <span id="copyright-year"></span>
        <span class="sr-only">. </span>
        Written by
        <a href="index.html">Alok</a>.
      </p>
    </footer>
  </body>
</html>
