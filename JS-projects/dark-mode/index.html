<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dark Mode</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>

  <body>
    <div class="background"></div>

    <div class="wrapper">
      <header class="hero">
        <div class="badge">
          <span class="status-dot"></span>
          Theme settings
        </div>

        <h1>
          Embrace the
          <span>dark side.</span>
        </h1>

        <p>
          Switch between light and dark mode and give your eyes
          a more comfortable experience.
        </p>
      </header>

      <main>
        <section class="theme-card">
          <div class="theme-info">
            <div class="icon" id="themeIcon">☀️</div>

            <div>
              <strong id="themeTitle">Light mode</strong>
              <span id="themeDescription">
                A bright and comfortable interface.
              </span>
            </div>
          </div>

          <label class="switch" aria-label="Toggle dark mode">
            <input type="checkbox" id="toggle" />
            <span class="slider">
              <span class="knob"></span>
            </span>
          </label>
        </section>

        <figure class="image-card">
          <img
            src="https://anjana.dev/vanilla-js-projects/assets/darth.jpg"
            alt="Darth Vader"
          />

          <figcaption>
            <span class="quote-mark">“</span>

            <div>
              <strong>The dark side awaits.</strong>
              <p>Choose your preferred appearance.</p>
            </div>
          </figcaption>
        </figure>
      </main>

      <footer>
        <span>Built with vanilla JavaScript</span>
        <span>•</span>
        <span id="year"></span>
      </footer>
    </div>
  </body>
</html>
