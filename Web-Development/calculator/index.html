<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>

  <body>
    <div class="wrapper">
      <header class="screen" id="screen"></header>
      <main class="calculator" id="calculator">
        <button class="calculator__button calculator__button--special" id="e">
          e
        </button>
        <button class="calculator__button calculator__button--special" id="mu">
          μ
        </button>
        <button class="calculator__button calculator__button--special" id="sin">
          sin
        </button>
        <button class="calculator__button calculator__button--special" id="deg">
          deg
        </button>
        <button
          class="calculator__button calculator__button--action"
          id="clear"
        >
          Ac
        </button>
        <button
          class="calculator__button calculator__button--action"
          id="backspace"
        >
          ⌫
        </button>
        <button
          class="calculator__button calculator__button--operator"
          id="divide"
        >
          /
        </button>
        <button
          class="calculator__button calculator__button--operator"
          id="multiply"
        >
          *
        </button>
        <button class="calculator__button" id="seven">7</button>
        <button class="calculator__button" id="eight">8</button>
        <button class="calculator__button" id="nine">9</button>
        <button
          class="calculator__button calculator__button--operator"
          id="subtract"
        >
          -
        </button>
        <button class="calculator__button" id="four">4</button>
        <button class="calculator__button" id="five">5</button>
        <button class="calculator__button" id="six">6</button>
        <button
          class="calculator__button calculator__button--operator calculator__button--plus"
          id="add"
        >
          +
        </button>
        <button class="calculator__button" id="one">1</button>
        <button class="calculator__button" id="two">2</button>
        <button class="calculator__button" id="three">3</button>
        <button class="calculator__button calculator__button--zero" id="zero">
          0
        </button>
        <button class="calculator__button" id="decimal">.</button>
        <button
          class="calculator__button calculator__button--equals"
          id="equals"
        >
          =
        </button>
      </main>
    </div>
  </body>
</html>
